name: probe-f
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Mask
        env:
          MASK: ${{ secrets.MASK_WORDS }}
        run: printf '%s\n' "$MASK" | while IFS= read -r w; do [ -n "$w" ] && echo "::add-mask::$w"; done; true
      - name: Ports
        env:
          HOST: ${{ secrets.F_DEPLOY_HOST }}
        run: |
          for p in 22 8022 443 80; do
            if timeout 15 bash -c "</dev/tcp/$HOST/$p" 2>/dev/null; then echo "port $p open"; else echo "port $p blocked"; fi
          done
