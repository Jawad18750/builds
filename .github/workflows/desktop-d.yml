name: desktop-d

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch or commit of the private repository'
        default: 'main'
      version:
        description: 'Version to stamp on the build'
        required: true
      windows:
        description: Windows
        type: boolean
        default: true
      mac:
        description: macOS
        type: boolean
        default: true
      win32:
        description: Windows 32-bit (its own update channel)
        type: boolean
        default: true
      electron32:
        description: Electron for the 32-bit build (the last line that ships win32-ia32)
        default: '43.8.13'

permissions:
  contents: read

jobs:
  build:
    if: inputs.windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Mask
        shell: bash
        env:
          MASK: ${{ secrets.MASK_WORDS }}
        run: printf '%s\n' "$MASK" | while IFS= read -r w; do [ -n "$w" ] && echo "::add-mask::$w"; done; true

      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.D_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.D_REPO_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the web workspaces
        run: npm ci --no-audit --no-fund --workspace packages/core --workspace packages/data --workspace packages/paper --include-workspace-root

      - name: Install the shell
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Build the web bundle
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run web

      - name: Package
        working-directory: apps/desktop
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: npx electron-builder --win nsis --x64 --publish never -c.extraMetadata.version="$VERSION"

      - name: Launch check
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\win-unpacked\*.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) { throw "the app exited within 30 seconds (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest.yml
          if-no-files-found: error
          retention-days: 3


  build32:
    if: inputs.win32
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Mask
        shell: bash
        env:
          MASK: ${{ secrets.MASK_WORDS }}
        run: printf '%s\n' "$MASK" | while IFS= read -r w; do [ -n "$w" ] && echo "::add-mask::$w"; done; true

      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.D_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.D_REPO_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the web workspaces
        run: npm ci --no-audit --no-fund --workspace packages/core --workspace packages/data --workspace packages/paper --include-workspace-root

      - name: Install the shell
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Build the web bundle
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run web

      - name: The 32-bit config
        working-directory: apps/desktop
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
          ELECTRON32: ${{ inputs.electron32 }}
        # The package's own build config, changed only where 32-bit differs: the arch, an
        # «-ia32» file name, the Electron line that still ships ia32, and the update channel
        # «ia32» (the app then reads ia32.yml, never the 64-bit latest.yml).
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const b = pkg.build;
            b.win.target = [{ target: "nsis", arch: ["ia32"] }];
            b.win.artifactName = String(b.win.artifactName).replace(".${ext}", "-ia32.${ext}");
            b.publish = (Array.isArray(b.publish) ? b.publish : [b.publish]).map((p) => ({ ...p, channel: "ia32" }));
            b.electronVersion = process.env.ELECTRON32;
            b.extraMetadata = { ...(b.extraMetadata || {}), version: process.env.VERSION };
            fs.writeFileSync("build-ia32.json", JSON.stringify(b, null, 1));
            console.log(b.win.artifactName, b.electronVersion);
          '

      - name: Package
        working-directory: apps/desktop
        shell: bash
        run: npx electron-builder --win nsis --ia32 --publish never --config build-ia32.json

      - name: Launch check
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\win-ia32-unpacked\*.exe | Select-Object -First 1
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 30
          if ($p.HasExited) { throw "the app exited within 30 seconds (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          Get-Content dist\ia32.yml

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-ia32
          path: |
            apps/desktop/dist/*.exe
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/ia32.yml
          if-no-files-found: error
          retention-days: 3

  mac:
    if: inputs.mac
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Mask
        shell: bash
        env:
          MASK: ${{ secrets.MASK_WORDS }}
        run: printf '%s\n' "$MASK" | while IFS= read -r w; do [ -n "$w" ] && echo "::add-mask::$w"; done; true

      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.D_REPO }}
          ref: ${{ inputs.ref }}
          ssh-key: ${{ secrets.D_REPO_KEY }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install the web workspaces
        run: npm ci --no-audit --no-fund --workspace packages/core --workspace packages/data --workspace packages/paper --include-workspace-root

      - name: Install the shell
        working-directory: apps/desktop
        run: npm ci --no-audit --no-fund

      - name: Build the web bundle
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run web

      # With a Developer ID certificate in the secrets the app is signed and notarized;
      # without one it is signed ad hoc, which Apple silicon needs to run it at all.
      - name: Package
        working-directory: apps/desktop
        env:
          VERSION: ${{ inputs.version }}
          P12: ${{ secrets.D_MAC_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.D_MAC_P12_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          if [ -n "$P12" ]; then
            printf '%s' "$ASC_API_KEY_P8" > "$RUNNER_TEMP/api.p8"
            export CSC_LINK="$P12" CSC_KEY_PASSWORD="$P12_PASSWORD"
            export APPLE_API_KEY="$RUNNER_TEMP/api.p8" APPLE_API_KEY_ID="$ASC_KEY_ID" APPLE_API_ISSUER="$ASC_ISSUER_ID"
            npx electron-builder --mac dmg zip --universal --publish never -c.extraMetadata.version="$VERSION"
          else
            echo "::notice::no Developer ID certificate: signing ad hoc"
            npx electron-builder --mac dmg zip --universal --publish never -c.extraMetadata.version="$VERSION" \
              -c.mac.identity=- -c.mac.hardenedRuntime=false
          fi

      - name: Signature and launch check
        working-directory: apps/desktop
        run: |
          app=$(ls -d dist/mac-universal/*.app | head -1)
          codesign --verify --deep --strict "$app"
          codesign -dv "$app" 2>&1 | grep -E '^(Format|Signature)=' || true
          exe="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          lipo -archs "$exe"
          "$exe" >/dev/null 2>&1 &
          pid=$!
          sleep 30
          kill -0 "$pid" || { echo "::error::the app exited within 30 seconds"; exit 1; }
          kill "$pid"

      - uses: actions/upload-artifact@v4
        with:
          name: desktop-mac
          path: |
            apps/desktop/dist/*.dmg
            apps/desktop/dist/*.zip
            apps/desktop/dist/*.blockmap
            apps/desktop/dist/latest-mac.yml
          if-no-files-found: error
          retention-days: 3
